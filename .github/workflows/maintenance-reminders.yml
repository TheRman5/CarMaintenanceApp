name: Maintenance email reminders

on:
  workflow_dispatch:
  schedule:
    # 13:17 UTC daily. Scheduled workflows only run from the default branch.
    - cron: "17 13 * * *"

permissions:
  contents: read

concurrency:
  group: maintenance-email-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Check due tasks and send emails
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMINDER_EMAIL_FROM: ${{ secrets.REMINDER_EMAIL_FROM }}
          REMINDER_EMAIL_TO: ${{ secrets.REMINDER_EMAIL_TO }}
          APP_ENV: development
        run: python -m app.reminders
